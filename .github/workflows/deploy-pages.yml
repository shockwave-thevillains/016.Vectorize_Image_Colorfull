name: Deploy to GitHub Pages

# Build sekali, lalu deploy ke SATU tujuan:
#   • Repository variable PAGES_REPO diisi (mis. "akun-lain/nama-repo")
#       → hasil build di-push ke branch PAGES_BRANCH (default: gh-pages) di repo itu,
#         memakai deploy key di secret PAGES_DEPLOY_KEY.
#   • PAGES_REPO kosong
#       → deploy ke GitHub Pages repo ini sendiri (perilaku lama).

on:
  push:
    # main = branch normal; claude/awesome-goldberg-vw1qfi = branch default repo ini saat ini
    branches: [main, claude/awesome-goldberg-vw1qfi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      # --- Tujuan: Pages repo ini sendiri ---
      - if: ${{ vars.PAGES_REPO == '' }}
        uses: actions/configure-pages@v5

      - if: ${{ vars.PAGES_REPO == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # --- Tujuan: repo di akun lain ---
      - if: ${{ vars.PAGES_REPO != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy-self:
    if: ${{ vars.PAGES_REPO == '' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Bila Settings → Pages → Source masih "Deploy from a branch", GitHub juga menjalankan
      # "pages build and deployment" yang menyajikan source mentah (halaman putih). Coba alihkan
      # Source ke "GitHub Actions" secara otomatis; bila token tidak diizinkan, langkah berikutnya
      # memastikan deploy versi build tetap yang terakhir.
      - name: Alihkan Pages ke mode GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' || echo unknown)
          echo "build_type saat ini: $current"
          if [ "$current" != "workflow" ]; then
            if gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow; then
              echo "Pages dialihkan ke mode GitHub Actions."
            else
              echo "::warning::Tidak bisa mengubah Source Pages otomatis. Ubah manual: Settings → Pages → Source → GitHub Actions."
            fi
          fi

      - name: Tunggu deploy mentah (legacy) untuk commit ini selesai
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$n" = "0" ]; then echo "Tidak ada deploy legacy yang berjalan."; exit 0; fi
            echo "Menunggu $n deploy legacy selesai…"; sleep 10
          done
          echo "::warning::Deploy legacy belum selesai setelah 6 menit; tetap lanjut."

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-external:
    if: ${{ vars.PAGES_REPO != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy key
        env:
          HAS_KEY: ${{ secrets.PAGES_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Secret PAGES_DEPLOY_KEY belum diisi. Lihat README bagian 'Hosting di repo akun lain'."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push build to ${{ vars.PAGES_REPO }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: ${{ vars.PAGES_REPO }}
          publish_branch: ${{ vars.PAGES_BRANCH || 'gh-pages' }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.repository }}@${{ github.sha }}"
